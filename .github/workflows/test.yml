name: test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test -race ./...
      - run: go vet ./...
      - run: go build -o bin/sup ./cmd/sup
      - run: sh tests/integration.sh
        env:
          BASH_BIN: /bin/bash
      - run: SUP=./bin/sup python3 tests/native.py
